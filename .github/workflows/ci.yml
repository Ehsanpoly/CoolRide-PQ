name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ops-console/package-lock.json
      - name: Install package and science extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[science]"
      - name: Install operations-console dependencies
        working-directory: apps/ops-console
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm ls typescript
          test -x node_modules/.bin/tsc
      - name: Verify native C++ toolchain
        run: |
          echo "Runner architecture: $(uname -m)"
          /usr/bin/g++ --version
      - name: Run Python, C++ and JavaScript checks
        env:
          CXX: /usr/bin/g++
        run: bash ./scripts/test.sh
      - name: Generate deterministic scenario and public graphics
        run: bash ./scripts/generate_demo.sh
      - name: Upload generated validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: coolride-pq-reference-output
          path: |
            generated/reference-scenario.json
            generated/reference-scenario.csv
            generated/reference-evidence.json
            docs/media/*.png
